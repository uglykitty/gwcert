name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release
  PROJECT_NAME: gwcert

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qttools'

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install openssl:x64-windows-release

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}" `
            -DOPENSSL_ROOT_DIR="${{ github.workspace }}\vcpkg\installed\x64-windows-release"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Test
        working-directory: build
        shell: pwsh
        run: ctest -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure

      - name: Install
        shell: pwsh
        run: |
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE "install"
          cmake --install build --config ${{ env.CMAKE_BUILD_TYPE }} --prefix $installPrefix

      - name: Package zip
        shell: pwsh
        run: |
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE "install"
          $packageRootDir = Join-Path $env:GITHUB_WORKSPACE "${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x64-msvc"
          $archiveName = "${{ env.PROJECT_NAME }}-${{ github.ref_name }}-windows-x64-msvc.zip"
          if (Test-Path $packageRootDir) {
            Remove-Item -Path $packageRootDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageRootDir | Out-Null
          Copy-Item -Path (Join-Path $installPrefix '*') -Destination $packageRootDir -Recurse -Force
          Compress-Archive -Path $packageRootDir -DestinationPath $archiveName -Force
          "RELEASE_ASSET_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseTag = "${{ github.ref_name }}"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title $releaseTag --generate-notes
          }
          gh release upload $releaseTag $env:RELEASE_ASSET_NAME --clobber
